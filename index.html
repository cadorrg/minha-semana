const KEY='minha-semana-v1';const $=s=>document.querySelector(s);const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const addDays=(iso,n)=>{let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const monday=(iso)=>{let d=new Date(iso+'T12:00:00');return addDays(iso,-((d.getDay()+6)%7))};const weekday=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const ptDate=(iso,opts={weekday:'long',day:'numeric',month:'long'})=>new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',opts);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let db;try{db=JSON.parse(localStorage.getItem(KEY))||empty()}catch{db=empty()}db={...empty(),...db};db.taskOccurrences=db.taskOccurrences||{};let active='hoje',week=monday(today()),selected=today(),modal=null,timer={taskId:'',remaining:25*60,deadline:null,running:false,seconds:25*60};let clock=null;

{tab:'hoje',title:'Bem-vindo ao seu guia',body:'O Minha Semana segue um ciclo simples: no domingo você organiza; durante a semana executa; no domingo seguinte revisa. O tutorial vai mostrar onde fazer cada etapa. Você pode pular quando quiser.'},
{tab:'hoje',title:'1. Captura rápida — a qualquer momento',body:'Pensou em algo importante? Toque no botão + flutuante em qualquer tela para guardar na Caixa de Entrada. Não precisa escolher data nem parar o que está fazendo. Se quiser, faça o exercício livre de 5 minutos em qualquer dia.'},

const save=()=>{persist();render()};const formatSecs=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.max(0,n)%60).padStart(2,'0')}`;
const dateDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const dueOffset=t=>t.dueDate&&t.date?dateDiff(t.date,t.dueDate):null;

function recurringOn(t,d){if(!t.repeat||t.repeat==='none'||!t.date||d<t.date)return false;let diff=dateDiff(t.date,d);if(t.repeat==='daily')return true;if(t.repeat==='weekly')return diff%7===0;if(t.repeat==='custom')return diff%Math.max(1,Number(t.everyDays)||1)===0;if(t.repeat==='monthly'){let a=new Date(t.date+'T12:00:00'),b=new Date(d+'T12:00:00'),months=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(months<0)return false;let lastDay=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();return b.getDate()===Math.min(a.getDate(),lastDay)}return false}
function occurrence(t,origin){let key=occurrenceKey(t.id,origin),over=db.taskOccurrences[key]||{},offset=dueOffset(t);let result={...t,id:occurrenceId(t.id,origin),seriesId:t.id,occurrenceDate:origin,date:origin,dueDate:offset===null?'':addDays(origin,offset),done:origin===t.date?!!t.done:false,priority:origin===t.date?!!t.priority:false,checklist:(t.checklist||[]).map(c=>({...c,done:origin===t.date?!!c.done:false}))};return {...result,...over,checklist:over.checklist||result.checklist}}
function tasksDay(date){let out=db.tasks.filter(t=>!t.repeat||t.repeat==='none').filter(t=>t.date===date);
for(let t of db.tasks.filter(t=>t.repeat&&t.repeat!=='none')){if(recurringOn(t,date)){let x=occurrence(t,date);if(!x.hidden&&x.date===date)out.push(x)}}
for(let [key,over] of Object.entries(db.taskOccurrences)){if(over.date!==date||over.hidden)continue;let pivot=key.lastIndexOf('|'),seriesId=key.slice(0,pivot),origin=key.slice(pivot+1);if(origin===date)continue;let t=db.tasks.find(t=>t.id===seriesId&&t.repeat&&t.repeat!=='none');if(t&&recurringOn(t,origin))out.push(occurrence(t,origin))}
return out.sort((a,b)=>(b.priority?1:0)-(a.priority?1:0))}
function getTask(id){if(!id)return null;if(id.startsWith('r:')){let p=id.lastIndexOf(':'),seriesId=id.slice(2,p),date=id.slice(p+1),base=db.tasks.find(t=>t.id===seriesId);return base?occurrence(base,date):null}return db.tasks.find(t=>t.id===id)}
function patchTask(t,changes){if(!t)return;if(t.seriesId){let k=occurrenceKey(t.seriesId,t.occurrenceDate);db.taskOccurrences[k]={...(db.taskOccurrences[k]||{}),...changes}}else Object.assign(t,changes)}
function checklistOf(t){return Array.isArray(t?.checklist)?t.checklist:[]}
const notDone=ts=>ts.filter(t=>!t.done);const planned=ts=>ts.reduce((n,t)=>n+(Number(t.minutes)||0),0);const capDay=d=>Number(db.capacities[d]??120);const objective=id=>db.goals.find(g=>g.id===id)?.title||'';

function page(){let body=({hoje:todayPage,semana:weekPage,objetivos:goalsPage,revisao:reviewPage,evolucao:statsPage})[active]();$('#app').innerHTML=`<main class="shell"><header class="top"><div class="brand"><span class="logo">▦</span><div>Minha Semana<div class="muted tiny">Planeje com clareza. Execute melhor.</div></div></div><button class="iconbtn" data-do="settings" aria-label="Configurações">⚙</button><button class="iconbtn" data-do="tour-start" aria-label="Como usar o Minha Semana">❔</button></header>${body}</main><nav class="nav" aria-label="Navegação principal">${[['hoje','⌂','Hoje'],['semana','▦','Semana'],['objetivos','◎','Objetivos'],['revisao','☑','Revisão'],['evolucao','▥','Evolução']].map(([k,i,n])=>`<button data-tab="${k}" class="${active===k?'active':''}"><span class="glyph">${i}</span>${n}</button>`).join('')}</nav><button class="quick-capture" data-do="quick-capture" aria-label="Capturar ideia rapidamente" title="Captura rápida">+</button>`;overlay();tourRender();}

function habitForm(id){let h=db.habits.find(x=>x.id===id);let days=habitDays(h);open(h?'Editar hábito':'Novo hábito',`<p class="muted">Defina o comportamento e quando deseja praticá-lo. A descrição é opcional e serve para esclarecer quando marcar como cumprido.</p><div class="field"><label for="habit-title">Nome do hábito</label><input id="habit-title" maxlength="120" value="${escape(h?.title||'')}" placeholder="Ex.: Não consumir açúcar adicionado"></div><div class="field"><label for="habit-description">Descrição (opcional)</label><textarea id="habit-description" maxlength="300" rows="3" placeholder="Ex.: Evitar doces e refrigerantes comuns. Frutas são permitidas.">${escape(h?.description||'')}</textarea><p class="muted tiny">Até 300 caracteres. Defina o que conta como cumprir o hábito.</p></div><div class="field"><label>Em quais dias?</label><div class="habit-day-picker">${HABIT_DAYS.map(([label,d])=>`<label title="${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'][d]}"><input type="checkbox" data-habit-day="${d}" ${days.includes(d)?'checked':''}><span>${label}</span></label>`).join('')}</div><p class="muted tiny" style="margin-top:7px">Escolha pelo menos um dia da semana.</p></div><div class="actions"><button class="btn" data-do="save-habit" data-id="${id||''}">Salvar hábito</button><button class="btn secondary" data-do="close">Cancelar</button></div>`)}

function startFocus(id){let t=getTask(id),len=Number(db.profile.focus)||25;timer={taskId:id||'',remaining:len*60,seconds:len*60,deadline:null,running:false};open('Modo foco',`<p class="muted">${escape(t?.title||'Sessão livre')}</p><div class="timer-time" id="timer-display">${formatSecs(timer.remaining)}</div><div class="actions"><button class="btn" data-do="timer-toggle" id="timer-toggle">▶ Iniciar</button><button class="btn secondary" data-do="timer-reset">Reiniciar</button><button class="btn secondary" data-do="timer-finish">Concluir sessão</button></div><p class="muted tiny" style="margin-top:15px">O contador usa o horário real e se corrige ao voltar à página. Para receber alerta com o navegador fechado, será necessário evoluir a versão.</p>`)}
function tick(){if(!timer.running)return;timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));let el=$('#timer-display');if(el)el.textContent=formatSecs(timer.remaining);if(timer.remaining<=0){timer.running=false;alarm();completeFocus();}}function alarm(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.06;o.start();o.stop(a.currentTime+.6)}catch{}if(db.profile.notifications&&'Notification'in window&&Notification.permission==='granted')new Notification('Minha Semana',{body:'Sua sessão de foco terminou!'});}
function completeFocus(){let spent=Math.max(1,Math.ceil((timer.seconds-timer.remaining)/60));db.focusSessions.push({id:uid(),date:today(),taskId:timer.taskId,minutes:spent});timer.running=false;persist();open('Sessão registrada!',`<p>Você dedicou <strong>${spent} minuto(s)</strong> à sua atividade.</p><p class="muted" style="margin-top:10px">Se concluiu a tarefa, marque-a na tela Hoje ou Semana.</p><button class="btn" data-do="close" style="margin-top:14px">Concluir</button>`);render();}
function handle(action,id,target){switch(action){case'tour-start':tourStart();break;case'tour-stop':tourStop();break;case'tour-next':tourMove(1);break;case'tour-back':tourMove(-1);break;case'settings':settings();break;case'close':close();break;case'newtask':taskForm(null,target.dataset.date||today());break;case'edit':taskEditChoice(id);break;case'edit-one':taskForm(id,null,null,'one');break;case'edit-series':taskForm(id,null,null,'series');break;case'inbox':inboxForm();break;case'quick-capture':quickCapture();break;case'brain-session':brainSession();break;case'focus':startFocus(id);break;case'newgoal':goalForm();break;case'editgoal':goalForm(id);break;case'newhabit':habitForm();break;case'edit-habit':habitForm(id);break;case'habit-info':habitInfo(id);break;case'priority':open('Prioridade de hoje',`<p class="muted">Escolha a tarefa mais importante para realizar hoje.</p><div class="field"><label>Tarefa</label><select id="priority-select"><option value="">Nenhuma</option>${tasksDay(today()).filter(t=>!t.done).map(t=>`<option value="${t.id}" ${t.priority?'selected':''}>${escape(t.title)}</option>`).join('')}</select></div><button class="btn" data-do="save-priority">Salvar prioridade</button>`);break;
case'finish-onboarding':db.profile.name=formval('ob-name');db.profile.purpose=formval('ob-purpose');if(formval('ob-goal'))db.goals.push({id:uid(),title:formval('ob-goal'),description:''});db.onboarded=true;close();save();tourStart();break;
case'save-task':{let title=formval('task-title'),date=$('#task-date')?.value||null,dueDate=$('#task-due')?.value||'',min=Number($('#task-min')?.value),goalId=$('#task-goal')?.value||'',priority=!!$('#task-priority')?.checked,mode=target.dataset.mode||'normal',original=getTask(id),repeat=mode==='one'?'none':$('#task-repeat')?.value||'none',everyDays=Number($('#task-repeat-every')?.value)||15,checklist=checklistFromText(checklistOf(original));
if(!title){alert('Informe o nome da tarefa.');break}if(!Number.isFinite(min)||min<1||min>1440){alert('Informe uma duração entre 1 e 1440 minutos.');break}if(!checklist)break;
if(repeat!=='none'&&!date){alert('Tarefas recorrentes precisam de uma data inicial.');break}if(repeat==='custom'&&(!Number.isInteger(everyDays)||everyDays<1||everyDays>365)){alert('Informe um intervalo de 1 a 365 dias.');break}if(dueDate&&(!date||dueDate<date)){alert('O vencimento deve ser igual ou posterior à data planejada.');break}
if(priority&&date)tasksDay(date).forEach(t=>{if(t.id!==id&&t.priority)patchTask(t,{priority:false})});
let fields={title,date,dueDate,minutes:min,goalId,priority,checklist};
if(mode==='one'&&original?.seriesId){patchTask(original,fields);let resulting={...original,...fields};patchTask(original,{done:checklist.length>0?checklist.every(c=>c.done):!!original.done});}
else {let t=db.tasks.find(x=>x.id===id);if(t){Object.assign(t,{...fields,repeat,everyDays});if(repeat!=='none'&&t.done&&checklist.length)t.done=checklist.every(c=>c.done)}else db.tasks.push({id:uid(),...fields,repeat,everyDays,done:false,createdAt:Date.now()})}
if(target.dataset.inboxId)db.inbox=db.inbox.filter(x=>x.id!==target.dataset.inboxId);close();save();break}
case'delete-task':if(confirm('Excluir esta tarefa?')){db.tasks=db.tasks.filter(t=>t.id!==id);close();save()}break;
case'delete-series':if(confirm('Excluir toda a série recorrente e seus registros de ocorrências?')){db.tasks=db.tasks.filter(t=>t.id!==id);for(let k of Object.keys(db.taskOccurrences))if(k.startsWith(id+'|'))delete db.taskOccurrences[k];close();save()}break;
case'delete-occurrence':{let t=getTask(id);if(t?.seriesId&&confirm('Excluir somente esta ocorrência? As outras continuarão na agenda.')){patchTask(t,{hidden:true});close();save()}break}
case'save-inbox':{let lines=formval('inbox-text').split('\n').map(x=>x.trim()).filter(Boolean);db.inbox.push(...lines.map(text=>({id:uid(),text,createdAt:Date.now()})));save();inboxForm();break}
case'save-quick':{let lines=formval('quick-text').split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length){alert('Escreva algo antes de guardar.');break}db.inbox.push(...lines.map(text=>({id:uid(),text,createdAt:Date.now()})));close();save();break}
case'brain-save':{let lines=formval('brain-text').split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length){alert('Escreva algo antes de guardar.');break}db.inbox.push(...lines.map(text=>({id:uid(),text,createdAt:Date.now()})));brainDeadline=null;save();inboxForm();break}
case'inboxidea':{let item=db.inbox.find(x=>x.id===id);if(item){item.category='idea';save();inboxForm()}break}
case'inboxremove':if(confirm('Excluir este item da Caixa de Entrada?')){db.inbox=db.inbox.filter(x=>x.id!==id);save();inboxForm()}break;
case'inboxconvert':{let item=db.inbox.find(x=>x.id===id);if(item)taskForm(null,null,id);break}
case'save-goal':{let title=formval('goal-title'),description=formval('goal-desc');if(!title){alert('Digite um nome para o objetivo.');break}let g=db.goals.find(g=>g.id===id);if(g)Object.assign(g,{title,description});else db.goals.push({id:uid(),title,description});close();save();break}
case'delete-goal':if(confirm('Excluir este objetivo? As tarefas vinculadas continuarão existindo.')){db.goals=db.goals.filter(g=>g.id!==id);db.tasks.forEach(t=>{if(t.goalId===id)t.goalId=''});close();save()}break;
case'editpurpose':open('Meu propósito',`<p class="muted">Por que você quer alcançar seus objetivos?</p><div class="field"><textarea id="purpose-edit" rows="5">${escape(db.profile.purpose)}</textarea></div><button class="btn" data-do="save-purpose">Salvar</button>`);break;
case'save-purpose':db.profile.purpose=formval('purpose-edit');close();save();break;
case'save-priority':{let v=$('#priority-select')?.value;tasksDay(today()).forEach(t=>patchTask(t,{priority:t.id===v}));close();save();break}
case'save-habit':{let name=formval('habit-title'),description=formval('habit-description').slice(0,300),days=[...document.querySelectorAll('[data-habit-day]:checked')].map(el=>Number(el.dataset.habitDay)).sort((a,b)=>a-b);if(!name){alert('Informe o nome do hábito.');break}if(!days.length){alert('Selecione pelo menos um dia da semana.');break}let h=db.habits.find(h=>h.id===id);if(h)Object.assign(h,{title:name,description,days});else db.habits.push({id:uid(),title:name,description,days});close();save();break}
case'deletehabit':if(confirm('Excluir este hábito?')){db.habits=db.habits.filter(h=>h.id!==id);save()}break;
case'save-note':db.dailyNotes[today()]=formval('daily');save();break;
case'savereview':{let w=addDays(monday(today()),-7),r=db.reviews.find(x=>x.week===w);let rec={week:w,good:formval('rev-good'),bad:formval('rev-bad'),action:formval('rev-action')};if(r)Object.assign(r,rec);else db.reviews.push(rec);save();alert('Revisão salva.');break}
case'reviewhelp':open('Roteiro para revisão',`<p>Para cada dificuldade, experimente responder:</p><div class="note">1. O que aconteceu de fato?<br>2. O que estava sob meu controle?<br>3. Qual pequeno ajuste posso testar?<br>4. Como vou perceber que funcionou?</div><p class="muted">A análise automática com IA está prevista para uma próxima versão. Neste MVP, o roteiro funciona sem internet.</p>`);break;
case'prevweek':week=addDays(week,-7);selected=week;render();break;case'nextweek':week=addDays(week,7);selected=week;render();break;case'jumpweek':week=monday(today());selected=today();render();break;
case'editcapacity':open('Tempo disponível',`<p class="muted">Quantos minutos livres você quer reservar para tarefas planejáveis em ${escape(ptDate(selected))}?</p><div class="field"><label>Minutos</label><input type="number" min="15" max="1440" value="${capDay(selected)}" id="capacity-min"></div><button class="btn" data-do="save-capacity">Salvar</button>`);break;
case'save-capacity':{let n=Number($('#capacity-min')?.value);if(n<15||n>1440||!Number.isFinite(n)){alert('Informe entre 15 e 1440 minutos.');break}db.capacities[selected]=n;close();save();break}
case'checkload':{let ds=Array.from({length:7},(_,i)=>addDays(week,i)),over=ds.filter(d=>planned(tasksDay(d))>capDay(d));open('Análise da semana',`<p>${over.length?`Há <strong>${over.length} dia(s)</strong> acima da capacidade definida.`:'Nenhum dia ultrapassa a capacidade definida.'}</p>${over.map(d=>`<div class="note">${escape(ptDate(d))}: ${planned(tasksDay(d))} min planejados para ${capDay(d)} min disponíveis.</div>`).join('')}<p class="muted">Ajuste a capacidade de cada dia ou edite a data das tarefas. Esta análise é baseada em regras, sem IA.</p><button class="btn" data-do="close" style="margin-top:12px">Entendi</button>`);break}
case'review-tab':close();active='revisao';render();break;
case'save-settings':{db.profile.name=formval('profile-name');db.profile.focus=Number($('#profile-focus')?.value)||25;db.profile.notifications=$('#profile-notifs')?.checked||false;if(db.profile.notifications&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});close();save();break}
case'export':{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='minha-semana-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}
case'reset':if(confirm('Apagar permanentemente todos os dados locais? Exporte um backup antes.')){localStorage.removeItem(KEY);db=empty();close();save();onboarding()}break;
case'timer-toggle':{if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));timer.running=false}else{timer.deadline=Date.now()+timer.remaining*1000;timer.running=true}let b=$('#timer-toggle');if(b)b.textContent=timer.running?'Ⅱ Pausar':'▶ Continuar';tick();break}
case'timer-reset':timer.running=false;timer.remaining=timer.seconds;$('#timer-display').textContent=formatSecs(timer.remaining);$('#timer-toggle').textContent='▶ Iniciar';break;
case'timer-finish':if(confirm('Registrar o tempo utilizado nesta sessão?'))completeFocus();break;
}}
document.addEventListener('click',ev=>{let tab=ev.target.closest('[data-tab]');if(tab){active=tab.dataset.tab;render();return}let dt=ev.target.closest('[data-date]');if(dt&&!dt.dataset.do){selected=dt.dataset.date;render();return}let btn=ev.target.closest('[data-do]');if(btn)handle(btn.dataset.do,btn.dataset.id||'',btn);});document.addEventListener('change',ev=>{let task=ev.target.closest('[data-task]'),habit=ev.target.closest('[data-habit]');if(task){let t=getTask(task.dataset.task);if(t){let checks=checklistOf(t);if(task.checked&&checks.length&&!checks.every(c=>c.done)){alert('Conclua todos os itens do checklist antes de marcar a tarefa.');task.checked=false}else{patchTask(t,{done:task.checked,completedAt:task.checked?Date.now():null});save()}}}
let checklistBox=ev.target.closest('[data-check-item]');if(checklistBox){let t=getTask(checklistBox.dataset.taskId);if(t){let checks=checklistOf(t).map(c=>({...c,done:c.id===checklistBox.dataset.checkItem?checklistBox.checked:c.done}));patchTask(t,{checklist:checks,done:checks.length>0&&checks.every(c=>c.done),completedAt:checks.length>0&&checks.every(c=>c.done)?Date.now():null});save()}}if(habit){db.habitLogs[today()+'|'+habit.dataset.habit]=habit.checked;save()}if(ev.target.id==='task-repeat'){let box=$('#task-repeat-extra');if(box)box.classList.toggle('hidden',ev.target.value!=='custom')}if(ev.target.id==='import-file'){let file=ev.target.files?.[0];if(!file)return;file.text().then(t=>{let imported=JSON.parse(t);if(!imported||!Array.isArray(imported.tasks)||!Array.isArray(imported.goals)||!imported.profile||!Array.isArray(imported.habits)||!Array.isArray(imported.inbox))throw Error('Arquivo incompatível');if(confirm('Substituir todos os dados locais por este backup?')){db={...empty(),...imported};db.taskOccurrences=db.taskOccurrences||{};close();save()}}).catch(()=>alert('Não foi possível importar este backup.'))}});setInterval(()=>{tick();brainTick()},500);document.addEventListener('visibilitychange',tick);window.addEventListener('focus',tick);render();if(!db.onboarded)onboarding();else if(!localStorage.getItem(TUTORIAL_KEY))tourStart();if(location.protocol.startsWith('http')&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script></body></html>
